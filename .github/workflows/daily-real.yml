name: daily-real

# 매일 국토부 실거래를 받아 보유 범위(data/coverage.json)를 갱신한다.
#  - 캐시(data/raw/molit, 약 1.3GB)는 actions/cache 에 둔다. 주 단위 키로 저장해 캐시가 쌓이지 않게 한다.
#    캐시가 복원되면 molit.RefreshPolicy 가 최근 달만 다시 받아 호출이 수백 회로 끝난다.
#    복원에 실패하면 전 기간(약 8,300회)을 받으므로 공공데이터포털 일일 한도를 넘지 않는지 로그를 본다.
#  - R-ONE·MDIS 원자료는 커밋되지 않으므로 커밋된 집계(data/reb, data/mdis)를 쓴다(run.py 가 알아서 고른다).
#  - dist/ 와 data/flows.json 은 커밋 금지다. 화면은 로컬에서 빌드하거나 따로 배포한다.
#    여기서 빌드까지 돌리는 이유는 coverage.json 이 build_flows 의 결과물이고, 빌드가 깨지는지도 함께 보기 때문이다.
#  - coverage.json 을 push 해도 github.token 으로는 다른 워크플로가 트리거되지 않는다.
#    check-updates 는 매일 00:13 UTC 에 돌므로(이 작업보다 약 2시간 30분 뒤) 그때 알림이 갱신된다.
on:
  schedule:
    - cron: "40 21 * * *"   # KST 06:40
  workflow_dispatch:
    inputs:
      from:
        description: "수집 시작 월 (YYYY-MM). 비우면 2023-01"
        required: false
        default: "2023-01"

permissions:
  contents: write

concurrency:
  group: daily-real
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - id: wk
        run: echo "w=$(date -u +%Y-W%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: data/raw/molit
          key: molit-${{ steps.wk.outputs.w }}
          restore-keys: molit-
      - name: 실거래 수집·빌드
        env:
          MOLIT_KEY: ${{ secrets.MOLIT_KEY }}
          KOSIS_KEY: ${{ secrets.KOSIS_KEY }}
        run: python pipeline/run.py real --from "${{ github.event.inputs.from || '2023-01' }}"
      - name: 보유 범위 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/coverage.json
          if git diff --cached --quiet; then
            echo "보유 범위가 그대로입니다(커밋 없음)."
            exit 0
          fi
          git commit -m "자동: 실거래 보유 범위 갱신 ($(date -u +%Y-%m-%d))"
          git push
