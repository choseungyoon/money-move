name: check-updates

# 새로 공개된 인구이동 자료가 있는지 확인하고 알림 이슈를 관리한다.
#  - 매일 KST 09:13 (UTC 00:13)
#  - 보유 자료 기록(data/coverage.json)이 push되면 바로: 반영된 알림을 곧장 닫기 위해
# MDIS 마이크로데이터는 로그인·이용 신청이 필요해 자동으로 받을 수 없다.
on:
  schedule:
    - cron: "13 0 * * *"
  push:
    branches: [main]
    paths: ["data/coverage.json"]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 공개 자료 확인
        env:
          KOSIS_KEY: ${{ secrets.KOSIS_KEY }}
        run: python pipeline/check_updates.py
      - name: 알림 이슈 만들기·닫기
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python pipeline/notify_issues.py
